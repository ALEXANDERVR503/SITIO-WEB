<h1>Empresa Medrano Flores Pan Sinaí como sistema abierto</h1>
<div>Actividad de Discusión 2: La organización como sistema abierto</div>
<p class="m">Asignatura: Teoría de Sistemas (Plan 2025) · Grupo 2<br>
Integrantes: Kenia Elizabeth Miranda Jimenez, Jorge Alexander Valdez Renderos,  Samuel de Jesus Humaña<br>
