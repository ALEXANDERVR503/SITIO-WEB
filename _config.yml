<h2 id="con">5. Conclusiones</h2>
<ul>
<li>Pan Sinaí cumple las características de un sistema abierto: recibe entradas del entorno, las transforma en productos y entrega resultados a clientes dentro y fuera del país.</li>
<li>Su entorno influye de forma directa: los precios de las materias primas, la competencia y los permisos obligatorios afectan sus decisiones.</li>
<li>La retroalimentación proviene de redes sociales, encargados de las sucursales de mercado y pedidos. Se usa para mejorar la calidad, hacer promociones y ajustar la producción cada semana.</li>
<li>Con esta actividad vimos que los conceptos de entradas, procesos, salidas, entorno y retroalimentación se pueden observar en una empresa real salvadoreña con más de 60 años de historia.</li>
</ul>

