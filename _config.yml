<nav><a href="#org">Organización</a><a href="#sis">Sistema abierto</a><a href="#ana">Análisis</a><a href="#evi">Evidencias</a><a href="#con">Conclusiones</a><a href="#fue">Fuentes</a></nav>
<main class="w">

<h2 id="org">1. La organización</h2>
<p>Pan Sinaí es una panadería salvadoreña de pan dulce que, según la información recibida en la entrevista, funciona desde diciembre de 1960. Comenzó en una casa pequeña, donde su primera dueña vendía pan francés en la tiendona. Ella creó la fórmula de la quesadilla y la heredó a su hijo, quien continuó el legado de la panadería.</p>
<div class="g">
<div class="c"><h3>Actividad principal</h3>Elaboración y venta de pan dulce de toda especialidad, basada en panes leudados y batidos.</div>
<div class="c"><h3>Ubicación</h3>Soyapango, San Salvador, donde está la única planta productora que tiene en el país. Según la entrevista, también hay una sucursal en Guatemala.</div>
<div class="c"><h3>Personal</h3>Más de 3,000 personas, divididas en producción, ventas y administración.</div>
<div class="c"><h3>Usuarios y clientes</h3>Público en general, Súper Selectos, Dollar City y consumidores en el exterior del país.</div>
</div>
<p class="m">La persona entrevistada pertenece al área de Recursos Humanos. Por su solicitud, no se publica su nombre.</p>

<h2 id="sis">2. Sistema abierto: entradas, procesos, salidas, entorno y retroalimentación</h2>
<div class="g">
<div class="c"><h3>Entradas</h3><ul>
<li>Materias primas: harinas de diferentes tipos, azúcares, grasas comestibles, ácidos alimenticios y colores naturales.</li>
<li>Maquinaria: hornos rotativos de túnel con bandas corredizas, amasadoras y batidoras industriales, fermentadores.</li>
<li>Energía: los hornos funcionan con gas y cuentan con mini plantas eléctricas para cuando se va la luz, que abastecen la zona.</li>
<li>Personal de producción, ventas y administración.</li>
<li>Pedidos recibidos por redes sociales.</li>
<li>Información: cambios de precios de materias primas, alzas de panes por temporada o fiestas y preferencias del público.</li></ul></div>
<div class="c"><h3>Procesos</h3><ul>
<li>Recepción y almacenado de la materia prima.</li>
<li>Paso al área de masas cuando se necesita, y transformación en masa.</li>
<li>Procesamiento hasta obtener el producto terminado, luego empacado y embazado.</li>
<li>Puesta a la venta.</li>
<li>Control de calidad por personal dedicado e inventarios de papelería, cartón y materia prima, según la producción semanal.</li>
<li>Dos turnos (diurno y nocturno) de 12 horas. La gerencia decide la producción diaria.</li></ul></div>
<div class="c"><h3>Salidas</h3><ul>
<li>Pan dulce de todo tipo. El más vendido es la quesadilla. Los de menor venta son los de temporada, como el pan de yema.</li>
<li>Venta a todo público.</li>
<li>Empleo para muchas personas.</li>
<li>Ventas a nivel internacional.</li>
<li>El pan sobrante se selecciona y una parte se reprocesa como complemento de otros productos.</li></ul></div>
<div class="c"><h3>Entorno</h3><ul>
<li>Clientes: Súper Selectos, Dollar City, consumidores del exterior.</li>
<li>Competencia: Pan Bimbo y Panadería Lido.</li>
<li>Factores: alzas repentinas de precios por guerras o desastres naturales en rutas de tránsito de materias primas.</li>
<li>Regulación: licencia de funcionamiento, permisos de seguridad y prevención de incendios, de ventas, de exportación, de salubridad y certificación de manipuladores de alimentos.</li></ul></div>
</div>
<div class="fb"><h3>Retroalimentación</h3>
La empresa se entera de la opinión de los clientes por quejas y comentarios en redes sociales, positivos o negativos, por los encargados de las sucursales de mercado (el área de ventas) y por los pedidos que llegan a gerencia. Con esa información cambió la calidad de un producto a partir de opiniones del público. Cuando bajan las ventas hace promociones o impulsa algún producto. Cuando suben los costos prioriza el gasto de materias primas para no perjudicar a los consumidores. La producción de algunos productos se varía cada semana.</div>

<h2 id="ana">3. Análisis aplicado</h2>
<p>Pan Sinaí funciona como un sistema abierto porque mantiene un intercambio constante con su entorno. Recibe materias primas, gas, personal e información externa, como los cambios de precios y las preferencias del público, y mantiene plantas eléctricas para seguir operando cuando falla la luz. Dentro de la organización, esas entradas se transforman mediante un proceso que va de la recepción y el almacenado, pasa por el área de masas y termina en el empacado. Como resultado salen productos terminados, empleo y ventas, tanto en el país como en el exterior.</p>
<p>El entorno condiciona al sistema en dos sentidos. Por un lado, lo limita: las leyes y permisos que debe cumplir, la competencia de otras panaderías y las alzas de precios por circunstancias fuera de su control. Por otro lado, lo alimenta, a través de clientes como Súper Selectos y Dollar City y de los consumidores. La retroalimentación cierra el ciclo: las quejas, los comentarios y los pedidos regresan a la gerencia y se convierten en cambios de calidad, promociones y ajustes semanales de producción. Gracias a ese ajuste, la organización se adapta a su entorno en lugar de funcionar aislada de él.</p>
<p class="m">Las áreas de producción, ventas y administración se pueden ver como subsistemas que trabajan juntos para lograr el objetivo común de la organización.</p>

